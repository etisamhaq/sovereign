# SSL-enabled config for sovereign.com
# Uses Docker DNS resolver for dynamic upstream resolution (prevents 502 after container restarts)

# ── Rate limit zones ──────────────────────────────────────────────────────
# General API limit: 60 req/min/ip with a burst of 30.
limit_req_zone $binary_remote_addr zone=api:10m rate=60r/m;
# Stricter limit for auth endpoints to slow brute-force / credential stuffing.
limit_req_zone $binary_remote_addr zone=auth:10m rate=5r/m;
# Tight limit for AI/agent streaming endpoints (long-lived; expensive).
limit_req_zone $binary_remote_addr zone=agents:10m rate=20r/m;

# Redirect HTTP to HTTPS
server {
    listen 80;
    server_name sovereign.com www.sovereign.com 13.48.92.184;

    # Health check — must be above the catch-all redirect so internal checks work over HTTP
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Certbot ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl;
    http2 on;
    server_name sovereign.com www.sovereign.com 13.48.92.184;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/sovereign.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sovereign.com/privkey.pem;

    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Docker DNS resolver — re-resolves container IPs every 30s
    # This prevents 502 errors when containers restart and get new IPs
    resolver 127.0.0.11 valid=30s;

    # SEO: Serve sitemap.xml at root (proxy to backend)
    location = /sitemap.xml {
        set $upstream_backend_sitemap http://backend:8000;
        proxy_pass $upstream_backend_sitemap/api/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Content-Type "application/xml; charset=UTF-8";
        proxy_cache_valid 200 1h;
    }

    # Frontend
    location / {
        set $upstream_frontend http://frontend:80;
        proxy_pass $upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API (rate limited). 60 r/min/ip with a burst window for organic UI usage.
    location /api {
        limit_req zone=api burst=30 nodelay;
        limit_req_status 429;
        set $upstream_backend http://backend:8000;
        proxy_pass $upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        client_max_body_size 50M;
    }

    # Auth endpoints — strict per-IP rate limit (covers both /api/ and /api/v1/).
    # Slows credential stuffing / brute-force attacks against login & registration.
    location ~ ^/api/(v1/)?auth/(login|register|password-reset|forgot-password) {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        set $upstream_backend_auth http://backend:8000;
        proxy_pass $upstream_backend_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Agent SSE streaming — long-lived, no buffering. Matches both versioned
    # (/api/v1/agents/chat/...) and legacy (/api/agents/chat/...) prefixes.
    location ~ ^/api/(v1/)?agents/chat/(stream|workflows/[^/]+/run)/ {
        limit_req zone=agents burst=10 nodelay;
        limit_req_status 429;
        set $upstream_backend_agents http://backend:8000;
        proxy_pass $upstream_backend_agents;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        chunked_transfer_encoding on;
        add_header X-Accel-Buffering no;
    }

    # Admin — share the strict auth zone (admin login is also a brute-force target).
    location /admin {
        limit_req zone=auth burst=10 nodelay;
        limit_req_status 429;
        set $upstream_backend_admin http://backend:8000;
        proxy_pass $upstream_backend_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django static files (admin panel only)
    location /staticfiles/ {
        alias /static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Media files (user uploads)
    location /mediafiles/ {
        alias /media/;
        expires 1y;
        add_header Cache-Control "public";
    }

    # Health check
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
